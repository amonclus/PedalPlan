app = 'training-dashboard'
primary_region = 'lhr'

[build]

[env]
  DB_PATH = '/data/db.sqlite'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source = 'training_data'
  destination = '/data'
  initial_size = '1gb'
